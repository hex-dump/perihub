<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PeriHub social preview</title>
    <!-- The 1280×640 picture GitHub and social networks show for links to the repository. -->
    <style>
      html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
      body {
        background: radial-gradient(ellipse at 85% 10%, rgba(214, 59, 255, 0.18), transparent 55%),
          radial-gradient(ellipse at 10% 100%, rgba(255, 106, 43, 0.16), transparent 50%), #0e0f13;
        color: #eef0f5;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        position: relative;
      }
      .bar { position: absolute; inset: 0 0 auto 0; height: 6px; background: linear-gradient(90deg, #ff5a1f, #d63bff 55%, #2f8bff); }
      .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; }
      .brand { display: flex; align-items: center; gap: 18px; }
      .brand img { width: 72px; height: 72px; }
      .brand span { font-size: 56px; font-weight: 750; letter-spacing: -0.02em; }
      h1 { font-size: 40px; line-height: 1.15; font-weight: 700; margin: 36px 0 22px; letter-spacing: -0.01em; }
      p { font-size: 22px; line-height: 1.45; color: #a9b0c0; margin: 0; }
      .shot {
        position: absolute; left: 590px; top: 92px; width: 1160px; height: 780px; border: 0;
        transform: scale(0.62); transform-origin: top left; border-radius: 22px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 2px #2a2e39;
      }
    </style>
  </head>
  <body>
    <div class="bar"></div>
    <div class="text">
      <div class="brand"><img src="../icon.svg" alt="" /><span>PeriHub</span></div>
      <h1>One app for gaming mice and keyboards across brands</h1>
      <p>Instead of G HUB, GG, iCUE and Synapse. Open source, for Windows and Linux. No account, no telemetry.</p>
    </div>
    <iframe class="shot" src="./index.html#keyboard:lighting" title="PeriHub"></iframe>
  </body>
</html>
