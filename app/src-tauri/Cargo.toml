[package]
name = "perihub-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "perihub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
perihub-core.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
dirs.workspace = true
env_logger = "0.11"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "~2.14"
tauri-plugin-dialog = "~2.8"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.100"
windows-result = "0.100"
windows-sys = { version = "0.61", features = ["Win32_System_Recovery", "Win32_System_Threading"] }
