# PeriHub on Flathub. Built from source, offline: cargo-sources.json and node-sources.json list
# every Rust crate and npm package, generated from Cargo.lock and app/package-lock.json (see
# README.md next to this file). The tag and commit below move with each release.
id: io.github.hex_dump.perihub
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
command: perihub

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # The GPU, and the keyboards and mice, which are reached through hidraw; software macros type through
  # /dev/uinput. The host's udev rule still decides which devices the user may open: PeriHub's
  # rule opens only the configuration interfaces (packaging/linux/70-perihub.rules).
  - --device=all
  # The icon in the system tray.
  - --talk-name=org.kde.StatusNotifierWatcher
  # App profiles on Hyprland: the window in focus, from Hyprland's event socket.
  - --filesystem=xdg-run/hypr:ro

modules:
  # Tauri's tray icon loads libayatana-appindicator, which the GNOME runtime does not have.
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: perihub
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/perihub/cargo
        CARGO_NET_OFFLINE: 'true'
        XDG_CACHE_HOME: /run/build/perihub/flatpak-node/cache
        npm_config_cache: /run/build/perihub/flatpak-node/npm-cache
        npm_config_offline: 'true'
    sources:
      - type: git
        url: https://github.com/hex-dump/perihub.git
        tag: v0.6.8
        commit: TO_BE_FILLED_AT_RELEASE
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - cargo-sources.json
      - node-sources.json
    build-commands:
      - npm ci --offline --prefix app
      - cargo --offline fetch --locked
      - npm run --offline --prefix app tauri build -- --no-bundle
      - install -Dm755 target/release/perihub /app/bin/perihub
      - install -Dm644 -t /app/share/applications packaging/linux/io.github.hex_dump.perihub.desktop
      - install -Dm644 -t /app/share/metainfo packaging/linux/io.github.hex_dump.perihub.metainfo.xml
      - install -Dm644 app/src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/io.github.hex_dump.perihub.png
      - install -Dm644 app/src-tauri/icons/64x64.png /app/share/icons/hicolor/64x64/apps/io.github.hex_dump.perihub.png
      - install -Dm644 app/src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.hex_dump.perihub.png
      - install -Dm644 app/src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/io.github.hex_dump.perihub.png
      - install -Dm644 app/src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/io.github.hex_dump.perihub.png
      - install -Dm644 LICENSE /app/share/licenses/io.github.hex_dump.perihub/LICENSE
