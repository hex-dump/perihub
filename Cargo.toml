[workspace]
resolver = "3"
members = ["crates/perihub-core", "crates/perihub-cli", "crates/xtask", "app/src-tauri"]

[workspace.package]
version = "0.9.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
perihub-core = { path = "crates/perihub-core" }
# On Linux we use hidraw: libusb would detach the kernel driver and the keyboard/mouse would stop working.
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
dirs = "7"

# A smaller release binary (Linux 28.5 MB to 16.2 MB) for about 40% more build time. Behavior is the
# same: no panic=abort, so the panics of device threads still unwind. "fat" would save 1 MB more for
# a build three times as long as without LTO.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
