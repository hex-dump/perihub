[workspace]
resolver = "3"
members = ["crates/perihub-core", "crates/perihub-cli", "app/src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
perihub-core = { path = "crates/perihub-core" }
# On Linux we use hidraw: libusb would detach the kernel driver and the keyboard/mouse would stop working.
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
dirs = "6"
