# Weekly updates, one pull request per ecosystem. CI runs on each.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # TypeScript 7 only once svelte-check makes it its default.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
