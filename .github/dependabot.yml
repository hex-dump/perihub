# Weekly updates, one pull request per ecosystem. CI runs on each.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # TypeScript 7 only once svelte-check makes it its default.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # v1 renames includeUpdaterJson and changes the download addresses in latest.json, which the
      # installed copies use to update: release.yml stays on v0 until that is moved over and tested.
      - dependency-name: tauri-apps/tauri-action
        update-types: ["version-update:semver-major"]
