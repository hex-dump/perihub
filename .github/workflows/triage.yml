name: Triage

# A new device request gets an answer: its level if the latest release already recognizes the device,
# "can be added directly" if another project documents it for a protocol PeriHub has a driver for, else
# "needs USB captures" (the labels "ready to add" and "needs captures"). A test report from an older
# version is asked to try the latest one, and both get the label of the brand ("brand: Razer") and of the
# kind of device ("mouse", "keyboard"): from the form's Brand and Device type dropdowns, else from the
# catalogue (tools/triage.py). A test report with nothing wrong in it that confirms a device starts the
# Confirm workflow (confirm.yml); for a device that only a test/* branch has (a report of that branch's test
# build), with that branch as the base, found by tools/test-branch-devices.sh. The issue text is only read by the script, never put in a command.
on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  # Every new issue: one made with a form has its label (or gets it here, if it did not exist when the
  # issue was made), and a report pasted as plain text (Copy test report instead of Open test form) is
  # recognized by its first line and gets the label it lacks.
  triage:
    runs-on: ubuntu-latest
    outputs:
      confirm: ${{ steps.answer.outputs.confirm }}
      branch: ${{ steps.answer.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            tools/triage.py
            tools/upstream-seen.json
            tools/test-branch-devices.sh
            site/devices.json
            crates/perihub-core/src/confirmed.rs
          sparse-checkout-cone-mode: false

      - name: Answer and labels
        id: answer
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          # The devices the latest release knows, not the ones only on main: the answer says "PeriHub
          # {latest} recognizes this device".
          gh api "repos/$GITHUB_REPOSITORY/contents/site/devices.json?ref=$latest" -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/released.json"
          # The devices of the test/* branches: a device only they have is confirmed on its branch.
          bash tools/test-branch-devices.sh "$RUNNER_TEMP/branches.json"
          python3 tools/triage.py "$GITHUB_EVENT_PATH" "${latest#v}" "$RUNNER_TEMP/released.json" "$RUNNER_TEMP/branches.json" > "$RUNNER_TEMP/triage.json"
          jq -r '.comment // empty' "$RUNNER_TEMP/triage.json" > "$RUNNER_TEMP/comment.md"
          if jq -e '.confirm' "$RUNNER_TEMP/triage.json" > /dev/null; then
            echo "confirm=true" >> "$GITHUB_OUTPUT"
            branch=$(jq -r '.confirm.branch // empty' "$RUNNER_TEMP/triage.json")
            if [[ "$branch" =~ ^test/[A-Za-z0-9._/-]+$ ]]; then echo "branch=$branch" >> "$GITHUB_OUTPUT"; fi
          fi
          if [ -s "$RUNNER_TEMP/comment.md" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          fi
          jq -r '.labels[]' "$RUNNER_TEMP/triage.json" | while IFS= read -r label; do
            # Brand labels are made the first time a brand comes up. tools/labels-migrate.sh makes the others.
            case "$label" in
              "brand: "*) gh label create "$label" --repo "$GITHUB_REPOSITORY" --color d4c5f9 --description "Devices of this brand" 2>/dev/null || true ;;
              "test report") gh label create "$label" --repo "$GITHUB_REPOSITORY" --color 0e8a16 --description "A device's test report" 2>/dev/null || true ;;
              "ready to add") gh label create "$label" --repo "$GITHUB_REPOSITORY" --color 0e8a16 --description "Documented by another project: can be added directly" 2>/dev/null || true ;;
              "needs captures") gh label create "$label" --repo "$GITHUB_REPOSITORY" --color fbca04 --description "No public documentation: needs USB captures" 2>/dev/null || true ;;
            esac
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "$label"
          done

  # The report confirms a device: a pull request for the maintainer to merge (confirm.yml decides again
  # from the issue itself, and needs its number, and the test branch when the device is only there).
  confirm:
    needs: triage
    if: needs.triage.outputs.confirm == 'true'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/confirm.yml
    with:
      issue: ${{ github.event.issue.number }}
      branch: ${{ needs.triage.outputs.branch }}
