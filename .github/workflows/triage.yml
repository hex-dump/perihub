name: Triage

# A new device request gets an answer: its level if the latest release already recognizes the device,
# "can be added directly" if another project documents it for a protocol PeriHub has a driver for, or if the HID
# descriptors of the request ("What PeriHub saw") show the configuration collection of a device family PeriHub has a
# driver for (tools/platforms.py, label "ready to add"); else what the bot checked (catalogue, upstream projects,
# collections) and that a recording of the official software is the optional help (label "needs captures"), with
# no promise that someone will look for documentation. A test report from an older
# version is asked to try the latest one, and both get the label of the brand ("brand: Razer") and of the
# kind of device ("mouse", "keyboard"): from the catalogue for a device it knows, else from the form's Brand
# and Device type dropdowns, else (a pasted report) from the app's own "Kind:" line (tools/triage.py). A test
# report with nothing wrong in it that confirms a device starts the Confirm workflow (confirm.yml); for a
# device that only a test/* branch has (a report of that branch's test build), with that branch as the base,
# found by tools/test-branch-devices.sh. A request that is "ready to add"
# with an id that can be added without a person (OpenRazer's mice through their generator, or a sibling id whose
# collection and reports match a family's in tools/platforms.py, added read only) starts Auto-add (auto-add.yml): the
# test branch, the test build and a pull request for the maintainer to merge are made without anyone: the
# device then goes into the next release as experimental, without waiting for a tester. The issue text is only read
# by the script, never put in a command.
on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  # Every new issue: one made with a form has its label (or gets it here, if it did not exist when the
  # issue was made), and a report pasted as plain text (Copy test report instead of Open test form) is
  # recognized by its first line and gets the label it lacks.
  triage:
    runs-on: ubuntu-latest
    outputs:
      confirm: ${{ steps.answer.outputs.confirm }}
      branch: ${{ steps.answer.outputs.branch }}
      auto_add: ${{ steps.answer.outputs.auto_add }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            tools/triage.py
            tools/platforms.py
            tools/upstream-seen.json
            tools/test-branch-devices.sh
            site/devices.json
            crates/perihub-core/src/confirmed.rs
          sparse-checkout-cone-mode: false

      - name: Answer and labels
        id: answer
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          # The devices the latest release knows, not the ones only on main: the answer says "PeriHub
          # {latest} recognizes this device".
          gh api "repos/$GITHUB_REPOSITORY/contents/site/devices.json?ref=$latest" -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/released.json"
          # The devices of the test/* branches: a device only they have is confirmed on its branch.
          bash tools/test-branch-devices.sh "$RUNNER_TEMP/branches.json"
          python3 tools/triage.py "$GITHUB_EVENT_PATH" "${latest#v}" "$RUNNER_TEMP/released.json" "$RUNNER_TEMP/branches.json" > "$RUNNER_TEMP/triage.json"
          jq -r '.comment // empty' "$RUNNER_TEMP/triage.json" > "$RUNNER_TEMP/comment.md"
          if jq -e '.confirm' "$RUNNER_TEMP/triage.json" > /dev/null; then
            echo "confirm=true" >> "$GITHUB_OUTPUT"
            branch=$(jq -r '.confirm.branch // empty' "$RUNNER_TEMP/triage.json")
            if [[ "$branch" =~ ^test/[A-Za-z0-9._/-]+$ ]]; then echo "branch=$branch" >> "$GITHUB_OUTPUT"; fi
          fi
          # An id that can be added without a person (tools/triage.py auto_addable: MECHANICAL, or a full match of a
          # family in tools/platforms.py): auto-add.yml writes it on a test branch and builds it, after checking the
          # request again itself. Only a USB id of the right shape goes on.
          auto=$(jq -r '.auto_add // empty' "$RUNNER_TEMP/triage.json")
          if [[ "$auto" =~ ^[0-9a-f]{4}:[0-9a-f]{4}$ ]]; then echo "auto_add=$auto" >> "$GITHUB_OUTPUT"; fi
          if [ -s "$RUNNER_TEMP/comment.md" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          fi
          # A kind label the device is not (the form's dropdown said otherwise than the report or the catalogue).
          jq -r '.remove_labels // [] | .[]' "$RUNNER_TEMP/triage.json" | while IFS= read -r label; do
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "$label" || true
          done
          jq -r '.labels[]' "$RUNNER_TEMP/triage.json" | while IFS= read -r label; do
            # Brand labels are made the first time a brand comes up. tools/labels-migrate.sh makes the others.
            case "$label" in
              "brand: "*) gh label create "$label" --repo "$GITHUB_REPOSITORY" --color d4c5f9 --description "Devices of this brand" 2>/dev/null || true ;;
              "test report") gh label create "$label" --repo "$GITHUB_REPOSITORY" --color 0e8a16 --description "A device's test report" 2>/dev/null || true ;;
              "ready to add") gh label create "$label" --repo "$GITHUB_REPOSITORY" --color 0e8a16 --description "Documented, or recognized by its collection: can be added directly" 2>/dev/null || true ;;
              "needs captures") gh label create "$label" --repo "$GITHUB_REPOSITORY" --color fbca04 --description "Not recognized: a recording of the official software would help" 2>/dev/null || true ;;
              "wontfix") gh label create "$label" --repo "$GITHUB_REPOSITORY" --color ffffff --description "This will not be worked on" 2>/dev/null || true ;;
            esac
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "$label"
          done
          if [ "$(jq -r '.close // empty' "$RUNNER_TEMP/triage.json")" = "not_planned" ]; then
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason "not planned"
          fi

  # The report confirms a device: a pull request for the maintainer to merge (confirm.yml decides again
  # from the issue itself, and needs its number, and the test branch when the device is only there).
  confirm:
    needs: triage
    if: needs.triage.outputs.confirm == 'true'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/confirm.yml
    with:
      issue: ${{ github.event.issue.number }}
      branch: ${{ needs.triage.outputs.branch }}

  # The id is ready to add and can be written without a person: the support is made on a test branch, built, and
  # its link is posted on the issue by the test build, and a pull request is opened, with nobody doing anything
  # until the maintainer merges it (the device ships as experimental, whether or not a tester tries the build).
  auto-add:
    needs: triage
    if: needs.triage.outputs.auto_add != ''
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    uses: ./.github/workflows/auto-add.yml
    with:
      issue: ${{ github.event.issue.number }}
      usb: ${{ needs.triage.outputs.auto_add }}
