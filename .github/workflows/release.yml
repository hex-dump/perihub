name: Release

# A vX.Y.Z tag creates a draft release with Windows and Linux installers.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Bundles (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Ubuntu's mirror is sometimes very slow (55 MB in almost 3 minutes for 0.5.2): the packages
      # downloaded last time are kept. apt still checks them and downloads the ones that changed.
      - name: Downloaded system packages (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/apt-archives/*.deb
          key: apt-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: apt-${{ matrix.os }}-

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-archives
          sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf
          cp /var/cache/apt/archives/*.deb ~/apt-archives/

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend dependencies
        working-directory: app
        run: npm ci

      # Installed copies check update files against this key: never release without it.
      - name: Updater public key is set
        shell: bash
        run: test -n "$(jq -r .plugins.updater.pubkey app/src-tauri/tauri.conf.json)"

      # Besides the installers, tauri.updater.conf.json makes signed update files and latest.json,
      # which PeriHub on Windows downloads from the latest release (see app/src-tauri/src/updates.rs).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: PeriHub ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md.
          releaseDraft: true
          prerelease: false
          args: --config ${{ github.workspace }}/app/src-tauri/tauri.updater.conf.json
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
