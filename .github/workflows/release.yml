name: Release

# A vX.Y.Z tag creates a draft release with the Windows and Linux installers and the Flatpak bundle,
# then checks the signatures and latest.json, attaches SHA256SUMS.txt and writes the notes from
# CHANGELOG.md (tools/release.py). Publishing the draft stays a manual step.
on:
  push:
    tags: ["v*"]
  # Started by the "Tag a release" workflow on the tag it pushes: a tag pushed with GITHUB_TOKEN
  # starts no workflow by itself.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Bundles (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Ubuntu's mirror is sometimes very slow (55 MB in almost 3 minutes for 0.5.2): the packages
      # downloaded last time are kept. apt still checks them and downloads the ones that changed.
      - name: Downloaded system packages (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/apt-archives/*.deb
          key: apt-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: apt-${{ matrix.os }}-

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-archives
          sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf
          cp /var/cache/apt/archives/*.deb ~/apt-archives/

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend dependencies
        working-directory: app
        run: npm ci

      # Installed copies check update files against this key: never release without it.
      - name: Updater public key is set
        shell: bash
        run: test -n "$(jq -r .plugins.updater.pubkey app/src-tauri/tauri.conf.json)"

      # Besides the installers, tauri.updater.conf.json makes signed update files and latest.json,
      # which PeriHub on Windows downloads from the latest release (see app/src-tauri/src/updates.rs).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: PeriHub ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md.
          releaseDraft: true
          prerelease: false
          args: --config ${{ github.workspace }}/app/src-tauri/tauri.updater.conf.json
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  # The Flatpak bundle (packaging/flatpak), built from source in Flathub's image, which has the GNOME
  # runtime. PeriHub is not on Flathub: the bundle is attached to the release like the other packages.
  flatpak:
    name: Flatpak bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      # flatpak-builder runs every build step in a bubblewrap sandbox.
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      # Flathub's runtime download sometimes fails with "Failed to update org.gnome.Sdk: Invalid cross-device
      # link": one more try is enough.
      - name: Build the bundle
        run: |
          packaging/flatpak/build-local.sh --system || {
            echo "::warning::The Flatpak build failed, trying once more"
            packaging/flatpak/build-local.sh --system
          }

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: packaging/flatpak/.build/*.flatpak
          # .build is a hidden folder, which upload-artifact leaves out by default.
          include-hidden-files: true
          if-no-files-found: error

  # The draft release exists once the other bundles are built.
  flatpak-release:
    name: Flatpak bundle to the release
    needs: [build, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: flatpak

      - name: Attach it to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" PeriHub_*_x86_64.flatpak --clobber --repo "$GITHUB_REPOSITORY"

  # Everything is on the draft: check it, add the checksums and the notes.
  finish:
    name: Checks, checksums and notes
    needs: [build, flatpak-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The tags, for the notes' comparison with the previous release.
          fetch-depth: 0

      - name: Download the draft's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release"

      # Each signature against the updater key in tauri.conf.json, latest.json against the files.
      - name: Signatures, latest.json and SHA256SUMS.txt
        run: python3 tools/release.py check "$RUNNER_TEMP/release" "${GITHUB_REF_NAME#v}"

      - name: Checksums, notes and title on the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/release/SHA256SUMS.txt" --clobber --repo "$GITHUB_REPOSITORY"
          python3 tools/release.py notes "$version" > "$RUNNER_TEMP/notes.md"
          # Publishing the release also opens a discussion with its notes in Announcements, for questions.
          gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --title "PeriHub $version" \
            --discussion-category Announcements --repo "$GITHUB_REPOSITORY"
