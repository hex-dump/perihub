name: Measure on Windows

# Started by hand (Actions → Measure on Windows → Run workflow): installs a release, or builds the
# chosen branch when no release is given, on a clean Windows VM and measures PeriHub's memory and
# CPU, the numbers quoted in the README. No devices are connected, so PeriHub only waits for them.
# The results are in the run's summary.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release to measure (empty = build this branch)
        default: ""

jobs:
  measure:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        if: inputs.tag == ''

      - uses: dtolnay/rust-toolchain@stable
        if: inputs.tag == ''

      - uses: Swatinem/rust-cache@v2
        if: inputs.tag == ''

      - uses: actions/setup-node@v7
        if: inputs.tag == ''
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the installer
        if: inputs.tag == ''
        working-directory: app
        run: |
          npm ci
          npm run tauri build -- --bundles nsis
          New-Item -ItemType Directory -Force ..\dl | Out-Null
          Copy-Item ..\target\release\bundle\nsis\*-setup.exe ..\dl\

      - name: Install
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ($env:TAG) { gh release download $env:TAG -R $env:GITHUB_REPOSITORY -p '*_x64-setup.exe' -D dl }
          $setup = Get-ChildItem dl\*_x64-setup.exe
          "Installer: $($setup.Name), $([math]::Round($setup.Length / 1MB, 1)) MB" | Tee-Object -Append results.txt
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\PeriHub" -Recurse -Filter *.exe | Where-Object Name -notmatch 'uninstall' | Select-Object -First 1
          $exe.FullName | Out-File exe.txt

      - name: Measure
        shell: pwsh
        run: |
          $exe = Get-Content exe.txt
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $os = Get-CimInstance Win32_OperatingSystem
          $webview = (Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe" | Select-Object -First 1).VersionInfo.ProductVersion
          "System: $($os.Caption) $($os.Version), $($cpu.Name.Trim()), $($cpu.NumberOfLogicalProcessors) logical processors, WebView2 $webview" | Tee-Object -Append results.txt
          "Installed: $exe, $([math]::Round((Get-ChildItem (Split-Path $exe) -Recurse | Measure-Object Length -Sum).Sum / 1MB, 1)) MB" | Tee-Object -Append results.txt

          # PeriHub and every process it started (the WebView2 processes that draw its window).
          function Get-Tree([int]$root) {
            $all = Get-CimInstance Win32_Process
            $ids = @($root)
            do {
              $more = @($all | Where-Object { $ids -contains $_.ParentProcessId -and $ids -notcontains $_.ProcessId } | ForEach-Object ProcessId)
              $ids += $more
            } while ($more.Count)
            $ids
          }
          function Measure-PeriHub([string]$label, [string[]]$arguments) {
            $p = Start-Process $exe -ArgumentList $arguments -PassThru
            Start-Sleep 60
            $ids = Get-Tree $p.Id
            $cpu = { param($list) (Get-Process -Id $list -ErrorAction SilentlyContinue | Measure-Object { $_.TotalProcessorTime.TotalMilliseconds } -Sum).Sum }
            $before = & $cpu $ids
            $beforeMain = & $cpu @($p.Id)
            Start-Sleep 120
            $ids = Get-Tree $p.Id
            $after = & $cpu $ids
            $afterMain = & $cpu @($p.Id)
            # "Memory" in Task Manager is the private working set.
            $perf = Get-CimInstance Win32_PerfFormattedData_PerfProc_Process | Where-Object { $ids -contains $_.IDProcess }
            $private = ($perf | Measure-Object WorkingSetPrivate -Sum).Sum
            $privateMain = ($perf | Where-Object IDProcess -eq $p.Id).WorkingSetPrivate
            $names = (Get-Process -Id $ids | Group-Object ProcessName | ForEach-Object { "$($_.Count) $($_.Name)" }) -join ', '
            $pct = { param($ms) [math]::Round($ms / 120000 * 100, 2) }
            "${label}: $($ids.Count) processes ($names), memory $([math]::Round($private / 1MB)) MB (private working set; perihub.exe alone $([math]::Round($privateMain / 1MB)) MB), CPU $(& $pct ($after - $before))% of one core over 120 s (perihub.exe alone $(& $pct ($afterMain - $beforeMain))%, WebView2 $(& $pct (($after - $before) - ($afterMain - $beforeMain)))%)" | Tee-Object -Append results.txt
            Get-Process -Id $ids -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 5
          }
          Measure-PeriHub 'In the tray (window closed)' @('--hidden')
          Measure-PeriHub 'Window open' @()

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          "## PeriHub on Windows" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-Content results.txt | ForEach-Object { "- $_" } | Out-File -Append $env:GITHUB_STEP_SUMMARY
