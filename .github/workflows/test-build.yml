name: Test build

# Builds the Windows installer and the Linux AppImage, .deb and Flatpak for testing, without a tag or a
# release: by itself for every push to a test/… branch, or by hand for any branch (Actions → Test build
# → Run workflow). The files are attached to the run as artifacts. When all three are built, the
# open issues named by a "Test: #30" line in the commits new to the push get a new comment with the link,
# and the branch's earlier comment is deleted (tools/notify.py).
on:
  push:
    branches: ["test/**"]
  workflow_dispatch:

# A newer push to the same branch replaces the build in progress.
concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the installer
        working-directory: app
        run: |
          npm ci
          npm run tauri build -- --bundles nsis

      # The app is a Cargo workspace member, so bundles land in the workspace's target folder.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: perihub-windows-test-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Linux AppImage and .deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Same package cache as the release workflow.
      - name: Downloaded system packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/apt-archives/*.deb
          key: apt-ubuntu-22.04-${{ github.run_id }}
          restore-keys: apt-ubuntu-22.04-

      - name: System dependencies
        run: |
          mkdir -p ~/apt-archives
          sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf
          cp /var/cache/apt/archives/*.deb ~/apt-archives/

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the AppImage and the .deb
        working-directory: app
        run: |
          npm ci
          npm run tauri build -- --bundles appimage,deb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: perihub-linux-test-${{ github.sha }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error

  # As in the release workflow.
  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The image has the GNOME runtime in a read-only layer of the container: when Flathub has a newer
      # one, flatpak-builder updates it by renaming folders across layers, which fails with "Invalid
      # cross-device link". A copy first puts the installation in the container's own layer.
      - name: Make the preinstalled runtimes updatable
        run: cp -a /var/lib/flatpak /var/lib/flatpak.copy && rm -rf /var/lib/flatpak && mv /var/lib/flatpak.copy /var/lib/flatpak

      # Flathub's runtime download sometimes fails with "Failed to update org.gnome.Sdk: Invalid cross-device
      # link": one more try is enough.
      - name: Build the bundle
        run: |
          packaging/flatpak/build-local.sh --system || {
            echo "::warning::The Flatpak build failed, trying once more"
            packaging/flatpak/build-local.sh --system
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: perihub-flatpak-test-${{ github.sha }}
          path: packaging/flatpak/.build/*.flatpak
          # .build is a hidden folder, which upload-artifact leaves out by default.
          include-hidden-files: true
          if-no-files-found: error

  # The issues named by "Test: #N" lines in the commits new to this push (not on main, not on another test/*
  # branch) get a new comment with the link to this run, so they are notified; the branch's older comment
  # goes. Skipped when the maintainer already posted a build by hand.
  notify:
    name: Tell the issues
    needs: [windows, linux, flatpak]
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'test/')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # All branches and their history: the commits on main and on the other test/* branches are not new.
          fetch-depth: 0
          sparse-checkout: tools/notify.py
          sparse-checkout-cone-mode: false

      - name: Fetch the other test branches
        run: git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/test/*:refs/remotes/origin/test/*"

      - name: Comment on the issues
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BEFORE: ${{ github.event.before }}
        run: python3 tools/notify.py testbuild "$GITHUB_SHA" "$RUN_URL" "$GITHUB_RUN_ID" --before "$BEFORE" --branch "$GITHUB_REF_NAME" --apply
