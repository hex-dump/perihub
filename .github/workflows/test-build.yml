name: Test build

# Started by hand (Actions → Test build → Run workflow): builds the Windows installer and the Linux
# AppImage, .deb and Flatpak of any branch for testing, without a tag or a release. The files are
# attached to the run as artifacts.
on:
  workflow_dispatch:

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the installer
        working-directory: app
        run: |
          npm ci
          npm run tauri build -- --bundles nsis

      # The app is a Cargo workspace member, so bundles land in the workspace's target folder.
      - uses: actions/upload-artifact@v7
        with:
          name: perihub-windows-test-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Linux AppImage and .deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # Same package cache as the release workflow.
      - name: Downloaded system packages
        uses: actions/cache@v6
        with:
          path: ~/apt-archives/*.deb
          key: apt-ubuntu-22.04-${{ github.run_id }}
          restore-keys: apt-ubuntu-22.04-

      - name: System dependencies
        run: |
          mkdir -p ~/apt-archives
          sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf
          cp /var/cache/apt/archives/*.deb ~/apt-archives/

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the AppImage and the .deb
        working-directory: app
        run: |
          npm ci
          npm run tauri build -- --bundles appimage,deb

      - uses: actions/upload-artifact@v7
        with:
          name: perihub-linux-test-${{ github.sha }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error

  # As in the release workflow.
  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Build the bundle
        run: packaging/flatpak/build-local.sh --system

      - uses: actions/upload-artifact@v7
        with:
          name: perihub-flatpak-test-${{ github.sha }}
          path: packaging/flatpak/.build/*.flatpak
          # .build is a hidden folder, which upload-artifact leaves out by default.
          include-hidden-files: true
          if-no-files-found: error
