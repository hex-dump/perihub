name: CI

on:
  push:
    branches: [main, "test/**"]
    # The website has its own workflow (pages.yml): no need to build the app for it.
    paths-ignore: ["site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths-ignore: ["site/**", ".github/workflows/pages.yml"]

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Ubuntu's mirror is sometimes very slow (55 MB in almost 3 minutes for 0.5.2): the packages
      # downloaded last time are kept. apt still checks them and downloads the ones that changed.
      - name: Downloaded system packages (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/apt-archives/*.deb
          key: apt-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: apt-${{ matrix.os }}-

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-archives
          sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf
          cp /var/cache/apt/archives/*.deb ~/apt-archives/

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend (type check, tests and build)
        working-directory: app
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
