name: CI

on:
  push:
    branches: [main, "test/**"]
    # The website has its own workflow (pages.yml): no need to build the app for it.
    paths-ignore: ["site/**", ".github/workflows/pages.yml"]
  # Every pull request, also one that only changes the website: the required checks must run, and
  # the "Website builds" job catches a site that would stop the Pages deploy.
  pull_request:
  # Run by hand on a branch (its checks do not count for a pull request's required checks).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every dependency's license (no GPL in an MIT app), known vulnerabilities and crate sources:
  # deny.toml for Rust, tools/check_npm_licenses.py for what npm puts in the app.
  licenses:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2
        with:
          arguments: --all-features
      - name: npm licenses
        run: python3 tools/check_npm_licenses.py

  # The website, built as pages.yml builds it (site/build.py checks every model has its row and page).
  site:
    name: Website builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin assets
          git archive FETCH_HEAD screenshots social-preview.png | tar -x -C docs
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets > "$RUNNER_TEMP/release.json"
          python3 site/build.py "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/_site"

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Ubuntu's mirror is sometimes very slow (55 MB in almost 3 minutes for 0.5.2): the packages
      # downloaded last time are kept. apt still checks them and downloads the ones that changed.
      - name: Downloaded system packages (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/apt-archives/*.deb
          key: apt-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: apt-${{ matrix.os }}-

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-archives
          sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf
          cp /var/cache/apt/archives/*.deb ~/apt-archives/

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend (type check, tests and build)
        working-directory: app
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      # Each version's section uses the sections the release notes know (tools/release.py).
      - name: Changelog
        if: runner.os == 'Linux'
        run: python3 tools/release.py lint

      - name: Tools tests
        if: runner.os == 'Linux'
        run: python3 -I -m unittest discover -s tools -p "test_*.py"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
