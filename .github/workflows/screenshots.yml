name: Screenshots

# The README's and website's screenshots (docs/screenshots) and the social preview, made from the
# interface with simulated devices (app/preview, npm run screenshots): by hand on any branch, and on
# main when a release is published. The pictures are not kept on main: changed ones are committed to
# the assets branch (screenshots/ and social-preview.png at its root), which the README links to and
# the website build reads. That branch is not covered by the ruleset on main, so GITHUB_TOKEN can
# push to it and no pull request is needed. A push made with GITHUB_TOKEN starts no workflow, so
# the website is started here.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag or label for the commit message, such as v0.9.1 (optional)
        required: false

permissions: {}

concurrency:
  group: screenshots
  cancel-in-progress: false

jobs:
  shots:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # push the assets branch
      actions: write   # start the website workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A release runs on its tag: the pictures go to main.
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}

      # Inter is in the interface's font list; without it the pictures would use another font.
      - name: Fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-inter

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Take them
        working-directory: app
        env:
          CHROME: google-chrome
        run: |
          npm ci
          npm run screenshots

      - name: Commit what changed
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ github.event.release.tag_name || inputs.tag || github.run_id }}
        run: |
          # The assets branch is made on the first run, with no parent, and kept after that.
          if git ls-remote --exit-code --heads origin assets >/dev/null; then
            git fetch origin assets
            git worktree add -B assets "$RUNNER_TEMP/assets" origin/assets
          else
            git worktree add --orphan -b assets "$RUNNER_TEMP/assets"
          fi
          rm -rf "$RUNNER_TEMP/assets/screenshots"
          mkdir "$RUNNER_TEMP/assets/screenshots"
          cp docs/screenshots/*.png "$RUNNER_TEMP/assets/screenshots/"
          cp docs/social-preview.png "$RUNNER_TEMP/assets/"
          cd "$RUNNER_TEMP/assets"
          git add -A
          if git diff --cached --quiet; then
            echo "The screenshots have not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Screenshots ($LABEL)"
          git push origin assets
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
