name: Website

# Publishes site/ to GitHub Pages (https://hex-dump.github.io/perihub/), with the
# download links and sizes of the latest release (see site/build.py). The screenshots workflow
# starts it again after it commits new pictures to the assets branch.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'release' && 'pages-release' || 'pages' }}
  cancel-in-progress: false

jobs:
  # A release event runs on its tag, and the github-pages environment only deploys from main:
  # start this workflow again on main instead. A workflow_dispatch made with GITHUB_TOKEN
  # does start a new run, unlike most events.
  on-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The screenshots and social preview live on the assets branch, not on main.
          git fetch --depth=1 origin assets
          git archive FETCH_HEAD screenshots social-preview.png | tar -x -C docs
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets > "$RUNNER_TEMP/release.json"
          python3 site/build.py "$RUNNER_TEMP/release.json" _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
