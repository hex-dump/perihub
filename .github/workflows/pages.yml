name: Website

# Publishes site/ to GitHub Pages (https://hex-dump.github.io/perihub/), with the
# download links and sizes of the latest release (see site/build.py).
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/screenshots/**", "docs/social-preview.png", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'release' && 'pages-release' || 'pages' }}
  cancel-in-progress: false

jobs:
  # A release event runs on its tag, and the github-pages environment only deploys from main:
  # start this workflow again on main instead. A workflow_dispatch made with GITHUB_TOKEN
  # does start a new run, unlike most events.
  on-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets > "$RUNNER_TEMP/release.json"
          python3 site/build.py "$RUNNER_TEMP/release.json" _site

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
