name: AUR package

# Once a release is published: the PKGBUILD and .SRCINFO of perihub-bin for it, with the checksum of
# its .deb, committed to the aur branch (only those two files, at its root, the layout of an AUR
# repository). The aur branch is not covered by the ruleset on main, so GITHUB_TOKEN can push to it
# and no pull request is needed. Publishing to aur.archlinux.org stays a manual step.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v0.8.5
        required: true

permissions: {}

concurrency:
  group: aur
  cancel-in-progress: false

jobs:
  pkgbuild:
    name: PKGBUILD and .SRCINFO
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the aur branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Update and commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          # The aur branch holds the previous PKGBUILD and .SRCINFO, which the script updates.
          if ! git ls-remote --exit-code --heads origin aur >/dev/null; then
            echo "::error::The aur branch does not exist: create it with the current PKGBUILD and .SRCINFO at its root."
            exit 1
          fi
          git fetch origin aur
          git worktree add -B aur "$RUNNER_TEMP/aur" origin/aur
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*_amd64.deb' --dir "$RUNNER_TEMP/deb"
          python3 tools/release.py aur "${TAG#v}" "$RUNNER_TEMP"/deb/*_amd64.deb "$RUNNER_TEMP/aur"
          cd "$RUNNER_TEMP/aur"
          if git diff --quiet; then
            echo "perihub-bin is already at ${TAG#v}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "AUR: perihub-bin ${TAG#v}"
          git push origin aur
