name: AUR package

# Once a release is published: packaging/aur/perihub-bin's PKGBUILD and .SRCINFO for it, with the
# checksum of its .deb, in a pull request from bot/aur-<version> (main does not take pushes; the
# required checks are run on the branch by dispatching ci.yml, and auto-merge is asked for).
# Publishing to aur.archlinux.org stays a manual step.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v0.8.5
        required: true

permissions: {}

concurrency:
  group: aur
  cancel-in-progress: false

jobs:
  pkgbuild:
    name: PKGBUILD and .SRCINFO
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the bot/ branch
      pull-requests: write  # open the pull request, ask for auto-merge
      actions: write        # dispatch ci.yml on the branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Update and commit
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
          HAS_BOT_TOKEN: ${{ secrets.BOT_TOKEN != '' }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*_amd64.deb' --dir "$RUNNER_TEMP/deb"
          python3 tools/release.py aur "${TAG#v}" "$RUNNER_TEMP"/deb/*_amd64.deb
          if git diff --quiet; then
            echo "perihub-bin is already at ${TAG#v}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "AUR: perihub-bin ${TAG#v}"
          branch="bot/aur-${TAG#v}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            branch="$branch-$GITHUB_RUN_ID"
          fi
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title "AUR: perihub-bin ${TAG#v}" \
            --body "PKGBUILD and .SRCINFO for ${TAG#v}, made by the AUR workflow."
          # A pull request made with GITHUB_TOKEN gets only a pull_request run that waits for approval,
          # and a dispatched ci.yml run is not attached to the pull request, so the required checks
          # never count. With a BOT_TOKEN secret (fine-grained token: contents and pull requests
          # write) the pull request is made as that user and CI runs on it like on any other.
          if [ "$HAS_BOT_TOKEN" != "true" ]; then
            echo "::warning::No BOT_TOKEN secret: approve the CI run on the pull request by hand."
            gh workflow run ci.yml --ref "$branch"
          fi
          if ! gh pr merge "$branch" --auto --merge; then
            echo "::notice::Auto-merge is not available: merge the pull request once its checks pass."
          fi
