name: Reminders

# Once a day (tools/remind.py): a device request or test report whose author has not answered the
# maintainer's question for 7 days gets one gentle reminder. Where closing is surely right (label "waiting for
# reporter", only safe labels, no pull request or test branch waiting for it) the reminder says so, and the
# issue is closed with the label "no answer" 14 days after the question; the author's next comment reopens it
# (waiting.yml).
on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            tools/remind.py
            tools/notify.py
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/remind.py --apply
