name: Device request
description: Ask for support for a new device
labels: ["device request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping PeriHub support more hardware. Devices are added once their protocol can be verified on real hardware, so the more details you share, the better. A USB capture is optional help, never required: the request counts without it.
  - type: input
    id: model
    attributes:
      label: Device model
      placeholder: e.g. Logitech G305 LIGHTSPEED
    validations:
      required: true
  - type: dropdown
    id: device-type
    attributes:
      label: Device type
      options:
        - Mouse
        - Keyboard
        - Receiver
  - type: dropdown
    id: brand
    attributes:
      label: Brand
      description: "Pick Other for a brand that is not listed."
      options:
        - Logitech
        - SteelSeries
        - Corsair
        - Razer
        - ASUS
        - Other
  - type: input
    id: usb-id
    attributes:
      label: USB ID (vendor:product)
      description: "Linux: `lsusb`. Windows: Device Manager → device → Properties → Details → Hardware IDs (VID_xxxx&PID_xxxx)."
      placeholder: e.g. 046d:c094
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What PeriHub saw
      description: Filled in by PeriHub's "Send a report" page, if you came from there. It holds the report ids and lengths of each interface. No serial numbers.
      render: text
  - type: checkboxes
    id: can-do
    attributes:
      label: What the device can do in its official software
      description: Tick everything its official software can change on it, even what you don't use. PeriHub aims to support all of it.
      options:
        - label: DPI
        - label: Polling rate
        - label: Lighting
        - label: Button remapping
        - label: Macros
        - label: Onboard profiles
        - label: Battery level
        - label: Something else (say what below)
  - type: textarea
    id: features
    attributes:
      label: Anything else it can do
      description: What the boxes above do not cover, or details such as the number of DPI levels or lighting zones.
      placeholder: Sensor settings, lift-off distance, sidetone, equalizer…
  - type: input
    id: software
    attributes:
      label: Official software it uses
      description: The program that changes its settings on Windows, if any, with its version if you know it.
      placeholder: e.g. Logitech G HUB, Razer Synapse 4, Corsair iCUE, a web app
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options:
        - Windows
        - Linux
  - type: checkboxes
    id: testing
    attributes:
      label: Testing
      options:
        - label: I can run read-only diagnostic commands and share their output.
        - label: Optionally, if I am comfortable with it, I can make a USB capture of the official software with the [capture guide](https://github.com/hex-dump/perihub/blob/main/docs/captures.md)
