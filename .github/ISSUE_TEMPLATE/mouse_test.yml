name: Mouse test report
description: Tell us how PeriHub works with one of the experimental Logitech mice
labels: ["mouse test"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! PeriHub only reads an experimental mouse and changes nothing, unless you turn on **Edit anyway…** yourself, so testing is safe. A model becomes fully supported once someone confirms that what PeriHub shows matches the mouse and that saving works.
  - type: input
    id: model
    attributes:
      label: Mouse model
      description: The name PeriHub shows at the top of the mouse page.
      placeholder: e.g. G502 X
    validations:
      required: true
  - type: input
    id: usb-id
    attributes:
      label: USB ID (vendor:product)
      description: "Linux: `lsusb`. Windows: Device Manager → device → Properties → Details → Hardware IDs (VID_xxxx&PID_xxxx)."
      placeholder: e.g. 046d:c099
    validations:
      required: true
  - type: input
    id: connection
    attributes:
      label: Connection
      description: "Through a LIGHTSPEED receiver, give the receiver's USB ID above."
      placeholder: USB cable or LIGHTSPEED receiver
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PeriHub version
      placeholder: e.g. 0.2.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows or Linux
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Test report
      description: "**Open test form** in PeriHub fills this in, and **Copy test report** copies it (Settings → Problems, or the notice on the mouse page). It has no key presses, apps or log lines. Through a LIGHTSPEED receiver it names the receiver, the slot and the mouse's wireless ID."
      render: text
  - type: checkboxes
    id: matches
    attributes:
      label: What PeriHub shows correctly
      description: Compare with the official software or with how the mouse behaves.
      options:
        - label: Profiles (number of profiles, which one is active)
        - label: DPI levels and the default level
        - label: Polling rate
        - label: Button assignments
        - label: Lighting zones and their colors
  - type: checkboxes
    id: saving
    attributes:
      label: Saving, if you turned on Edit anyway…
      description: Optional, and at your own risk. Leave these empty if you only read the mouse.
      options:
        - label: A change I saved took effect on the mouse
        - label: It was still there after unplugging the mouse and plugging it back in
        - label: Letting the 15 seconds run out put the old settings back
  - type: textarea
    id: notices
    attributes:
      label: Messages and errors
      description: Any message PeriHub shows on the mouse page (for example about software control or the profile format), or an error if the mouse does not appear.
  - type: textarea
    id: details
    attributes:
      label: What is wrong or missing
      description: Anything that does not match. Screenshots are very helpful.
