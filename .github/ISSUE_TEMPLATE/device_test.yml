name: Device test report
description: Tell us how PeriHub works with a Corsair, ASUS, SteelSeries, Razer, Glorious, Roccat, Pulsar, Lamzu, Cooler Master or EVGA device, a QMK keyboard (Vial, VIA), the Logitech G300, G600, G500s, G700s, G9x and their older siblings (G9, G500, G700), or a Logitech device on a Bolt or Unifying receiver
labels: ["device test"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! PeriHub only reads Corsair devices, and can try one colour of lighting on them for the session, if you turn it on. On the Logitech G300 it reads and saves the three profiles. On the Logitech G9, G9x, G500, G500s, G700 and G700s (with the cable) it reads the profile in use, and on the G500s and G700s it can set the DPI in use until the mouse is unplugged, if you choose to; it never writes their memory. For a Logitech device on a Bolt or Unifying receiver it reads what the device is, and can set its DPI, if you choose to. On ASUS, SteelSeries, Razer and Glorious mice, and on QMK keyboards, it reads what the device reports, and changes settings only if you choose to, at your own risk. A device becomes fully supported once someone confirms that what PeriHub shows matches it.
  - type: input
    id: model
    attributes:
      label: Device
      description: The name PeriHub shows at the top of the device page.
      placeholder: e.g. Corsair M65 RGB ULTRA, ASUS ROG Keris, or Logitech G300
    validations:
      required: true
  - type: input
    id: usb-id
    attributes:
      label: USB ID (vendor:product)
      description: "Linux: `lsusb`. Windows: Device Manager → device → Properties → Details → Hardware IDs (VID_xxxx&PID_xxxx)."
      placeholder: e.g. 1b1c:1b9e
    validations:
      required: true
  - type: input
    id: connection
    attributes:
      label: Connection
      placeholder: USB cable or wireless receiver
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PeriHub version
      placeholder: e.g. 0.6.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows or Linux
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Test report
      description: "**Open test form** on the device page fills this in, and **Copy test report** copies it. It has no key presses, apps or log lines."
      render: text
  - type: checkboxes
    id: matches
    attributes:
      label: What PeriHub shows correctly
      description: Compare with the official software (iCUE, Logitech Gaming Software, Armoury Crate) or with how the device behaves.
      options:
        - label: Firmware version
        - label: Polling rate (report rate)
        - label: DPI (mice)
        - label: "G300: profiles, DPI levels, light colour and buttons"
        - label: "G300: a profile I saved took effect and was still there after unplugging the mouse"
        - label: "Corsair: experimental lighting showed the colour, and the device went back to its own lighting when it was turned off"
        - label: "Corsair: every button or key kept working while experimental lighting was on"
        - label: "Bolt or Unifying: Set DPI took effect (the pointer moved faster or slower)"
        - label: "Bolt or Unifying: after the device slept or was turned off and on, PeriHub set the DPI again"
        - label: "Bolt or Unifying: without PeriHub running, the device kept the DPI after it slept or was turned off and on"
        - label: "Bolt or Unifying: Back to the device's own DPI worked"
        - label: "Other brands (ASUS, SteelSeries, Razer, Glorious, Roccat, Pulsar, Lamzu, Cooler Master, EVGA, QMK keyboards): the DPI levels, polling rate, lighting and buttons PeriHub shows match the device"
        - label: "Other brands: a change made with Apply took effect"
        - label: "Other brands: after unplugging the device (or turning it off) a change made only with Apply was gone"
        - label: "Other brands: a change made with Save to memory was still there after unplugging the device"
        - label: "Other brands: a change I did not keep was undone after 15 seconds"
  - type: textarea
    id: notices
    attributes:
      label: Messages and errors
      description: Any message PeriHub shows on the device page, or an error if the device does not appear. Also say which official software was running, such as Logi Options+.
  - type: textarea
    id: details
    attributes:
      label: What is wrong or missing
      description: Anything that does not match. Screenshots are very helpful.
